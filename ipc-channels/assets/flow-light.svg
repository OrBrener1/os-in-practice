<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="24" y="124" width="170" height="82" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="109.0" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488">Producer</text><text x="109.0" y="170" text-anchor="middle" font-size="12" fill="#59636e">a forked child</text><text x="109.0" y="186" text-anchor="middle" font-size="12" fill="#59636e">writes N records</text><rect x="706" y="124" width="170" height="82" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="791.0" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Consumer</text><text x="791.0" y="170" text-anchor="middle" font-size="12" fill="#59636e">the parent</text><text x="791.0" y="186" text-anchor="middle" font-size="12" fill="#59636e">count, sum, min, max</text><rect x="300" y="14" width="300" height="62" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="450.0" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">pipe</text><text x="450.0" y="60" text-anchor="middle" font-size="12" fill="#59636e">anonymous, a kernel buffer</text><path d="M196,141 C250,141 250,45 298,45" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M602,45 C650,45 650,141 704,141" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="94" width="300" height="62" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="450.0" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">fifo</text><text x="450.0" y="140" text-anchor="middle" font-size="12" fill="#59636e">named pipe in a private temp dir</text><path d="M196,157 C250,157 250,125 298,125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M602,125 C650,125 650,157 704,157" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="174" width="300" height="62" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="450.0" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#9333ea">shm-slot</text><text x="450.0" y="220" text-anchor="middle" font-size="12" fill="#59636e">shared memory, a one-record mailbox</text><path d="M196,173 C250,173 250,205 298,205" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M602,205 C650,205 650,173 704,173" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="254" width="300" height="62" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="450.0" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#9333ea">shm</text><text x="450.0" y="300" text-anchor="middle" font-size="12" fill="#59636e">shared memory, a ring of 4096 records</text><path d="M196,189 C250,189 250,285 298,285" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M602,285 C650,285 650,189 704,189" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/></svg>
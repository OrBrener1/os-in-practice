<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="130" y="14" width="756" height="312" rx="16" fill="none" stroke="#3d444d" stroke-dasharray="6 5"/><text x="150" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9198a1">SCHEDULER, THE PARENT PROCESS</text><line x1="64" y1="122" x2="850" y2="122" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/><rect x="300" y="232" width="560" height="76" rx="14" fill="#2a1840" stroke="#9333ea" stroke-width="1.6"/><text x="320" y="254" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#9198a1">CHILD PROCESSES: ONE PER JOB, PARKED UNTIL SIGCONT</text><rect x="320" y="266" width="120" height="28" rx="14" fill="#0d1117" stroke="#9333ea" stroke-opacity="0.7"/><text x="380" y="284.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f0f6fc">init</text><rect x="455" y="266" width="120" height="28" rx="14" fill="#0d1117" stroke="#9333ea" stroke-opacity="0.7"/><text x="515" y="284.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f0f6fc">sshd</text><rect x="590" y="266" width="120" height="28" rx="14" fill="#0d1117" stroke="#9333ea" stroke-opacity="0.7"/><text x="650" y="284.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f0f6fc">cron</text><rect x="725" y="266" width="120" height="28" rx="14" fill="#0d1117" stroke="#9333ea" stroke-opacity="0.7"/><text x="785" y="284.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f0f6fc">backup</text><path d="M470,141 L470,230" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="482" y="216" text-anchor="start" font-size="11.5" font-weight="600" fill="#9198a1">resumes one job at a time</text><circle cx="64" cy="122" r="17" fill="#0d1117" stroke="#0d9488" stroke-width="5"/><text x="64" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">CSV file</text><text x="64" y="86" text-anchor="middle" font-size="12" fill="#9198a1">the job list</text><circle cx="190" cy="122" r="17" fill="#0d1117" stroke="#4f46e5" stroke-width="5"/><text x="190" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">1</text><text x="190" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">create_children</text><text x="190" y="86" text-anchor="middle" font-size="12" fill="#9198a1">one fork per job</text><circle cx="330" cy="122" r="17" fill="#0d1117" stroke="#4f46e5" stroke-width="5"/><text x="330" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">2</text><text x="330" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">pick_next</text><text x="330" y="186" text-anchor="middle" font-size="12" fill="#9198a1">chosen by policy</text><circle cx="470" cy="122" r="17" fill="#0d1117" stroke="#9333ea" stroke-width="5"/><text x="470" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">3</text><text x="470" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">give_cpu</text><text x="470" y="86" text-anchor="middle" font-size="12" fill="#9198a1">SIGCONT</text><circle cx="610" cy="122" r="17" fill="#0d1117" stroke="#9333ea" stroke-width="5"/><text x="610" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">4</text><text x="610" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">simulate</text><text x="610" y="186" text-anchor="middle" font-size="12" fill="#9198a1">sleeps until SIGALRM</text><circle cx="750" cy="122" r="17" fill="#0d1117" stroke="#9333ea" stroke-width="5"/><text x="750" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">5</text><text x="750" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">end of slice</text><text x="750" y="86" text-anchor="middle" font-size="12" fill="#9198a1">SIGSTOP or SIGTERM</text><circle cx="850" cy="122" r="22" fill="#0d1117" stroke="#059669" stroke-width="5"/><text x="846" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc">Report</text><text x="846" y="192" text-anchor="middle" font-size="12" fill="#9198a1">per algorithm</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="16" y="150" width="150" height="76" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="91.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#0d9488">Agent</text><text x="91.0" y="196" text-anchor="middle" font-size="12" fill="#59636e">asks for a tool call</text><text x="91.0" y="212" text-anchor="middle" font-size="12" fill="#59636e">JSON on stdin</text><rect x="500" y="150" width="140" height="76" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="570.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Tool runs</text><text x="570.0" y="196" text-anchor="middle" font-size="12" fill="#59636e">Bash, Edit</text><text x="570.0" y="212" text-anchor="middle" font-size="12" fill="#59636e">or Write</text><rect x="200" y="20" width="268" height="360" rx="16" fill="none" stroke="#d0d7de" stroke-dasharray="6 5"/><text x="220" y="46" font-size="12" font-weight="700" letter-spacing="1.5" fill="#59636e">BEFORE · PreToolUse</text><rect x="220" y="54" width="228" height="56" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="334.0" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9333ea">firewall.sh</text><text x="334.0" y="100" text-anchor="middle" font-size="12" fill="#59636e">for Bash</text><rect x="220" y="120" width="228" height="56" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="334.0" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9333ea">rate_limiter.sh</text><text x="334.0" y="166" text-anchor="middle" font-size="12" fill="#59636e">for Bash</text><rect x="220" y="186" width="228" height="56" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="334.0" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9333ea">commit_validator.sh</text><text x="334.0" y="232" text-anchor="middle" font-size="12" fill="#59636e">for Bash</text><rect x="220" y="252" width="228" height="56" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/><text x="334.0" y="278" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9333ea">auto_backup.sh</text><text x="334.0" y="298" text-anchor="middle" font-size="12" fill="#59636e">for Edit, Write</text><path d="M334,110 L334,119" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M334,176 L334,185" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="334" y="340" text-anchor="middle" font-size="11.5" font-weight="600" fill="#59636e">in order; exit 2 blocks</text><text x="334" y="356" text-anchor="middle" font-size="11.5" font-weight="600" fill="#59636e">and stops the chain</text><rect x="672" y="20" width="212" height="168" rx="16" fill="none" stroke="#d0d7de" stroke-dasharray="6 5"/><text x="692" y="46" font-size="12" font-weight="700" letter-spacing="1.5" fill="#59636e">AFTER · PostToolUse</text><rect x="690" y="64" width="176" height="60" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="778.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#059669">syntax_checker.sh</text><text x="778.0" y="110" text-anchor="middle" font-size="12" fill="#59636e">for Edit, Write</text><text x="778" y="156" text-anchor="middle" font-size="11.5" font-weight="600" fill="#59636e">exit 1 warns, never blocks</text><rect x="672" y="212" width="212" height="168" rx="16" fill="none" stroke="#d0d7de" stroke-dasharray="6 5"/><text x="692" y="238" font-size="12" font-weight="700" letter-spacing="1.5" fill="#59636e">SESSION END · Stop</text><rect x="690" y="256" width="176" height="60" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><text x="778.0" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#059669">session_summary.sh</text><text x="778.0" y="302" text-anchor="middle" font-size="12" fill="#59636e">log to a report</text><text x="778" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="#59636e">prints a systemMessage</text><path d="M168,188 L198,188" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M470,188 L498,188" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M642,170 C658,170 656,120 670,110" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M642,206 C658,206 656,280 670,290" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/></svg>